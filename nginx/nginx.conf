upstream tidy_linker {
    server web:8000;
}

# HTTP -> HTTPS redirect for cgsabiozard.co.uk (allow ACME challenge)
server {
    listen 80;
    server_name cgsabiozard.co.uk www.cgsabiozard.co.uk;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server for cgsabiozard.co.uk
server {
    listen 443 ssl;
    http2 on;
    server_name cgsabiozard.co.uk www.cgsabiozard.co.uk;

    ssl_certificate     /etc/letsencrypt/live/cgsabiozard.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cgsabiozard.co.uk/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://tidy_linker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location /ws/ {
        proxy_pass http://tidy_linker;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
    }
}
